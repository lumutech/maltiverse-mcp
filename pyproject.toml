[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maltiverse-mcp"
version = "0.1.0"
description = "Local stdio MCP server exposing the Maltiverse threat-intelligence API to Claude Code and other MCP clients."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "maltiverse-mcp contributors" }]
keywords = ["mcp", "maltiverse", "threat-intelligence", "claude", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]

# mcp is capped <3: the v1->v2 rename (FastMCP -> MCPServer, httpx -> httpx2)
# broke every unpinned server silently. httpx2 is NOT a second HTTP stack --
# it is the exact client the mcp SDK already depends on, so we reuse it.
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2.12",
    "httpx2>=2.10",
]

[project.optional-dependencies]
# The API is mocked with httpx2.MockTransport (shipped with httpx2, which the
# mcp SDK already pulls in), so no separate HTTP-mocking library is needed.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
# This is what makes `claude mcp add ... -- maltiverse-mcp` work.
maltiverse-mcp = "maltiverse_mcp.server:main"

[project.urls]
Homepage = "https://github.com/maltiverse/maltiverse-mcp"
Issues = "https://github.com/maltiverse/maltiverse-mcp/issues"
Changelog = "https://github.com/maltiverse/maltiverse-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/maltiverse_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["maltiverse_mcp"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["httpx2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
